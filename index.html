<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* NAV */
nav {
  background: #2c3e50;
  padding: 15px;
  text-align: center;
}

nav button {
  background: #3498db;
  color: white;
  border: none;
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
  border-radius: 5px;
}

/* PAGES */
.page {
  display: none;
  padding: 40px;
  text-align: center;
}

.active {
  display: block;
}

/* WHITE PAGE */
.white-page {
  background: white;
  color: black;
  height: 100vh;
}
</style>
</head>

<body>

<nav>
  <button onclick="showPage('home')">Home</button>
  <button onclick="showPage('math')">Math</button>
  <button onclick="showPage('reading')">Reading</button>
  <button onclick="showPage('extra')">Extra Games</button>
</nav>

<!-- HOME -->
<div id="home" class="page active">
  <h1>Welcome to Learning Hub 📚</h1>
  <p>Practice math, reading, and more!</p>
</div>

<!-- MATH -->
<div id="math" class="page">
  <h1>Math Games ➕</h1>
  <p>Coming soon...</p>
</div>

<!-- READING -->
<div id="reading" class="page">
  <h1>Reading Games 📖</h1>
  <p>Coming soon...</p>
</div>

<!-- EXTRA (WHITE PAGE) -->
<div id="extra" class="page white-page">
  <h1>Extra Games</h1>
  <p>Click below to continue</p>

  <button onclick="openGames()" style="padding:15px 25px; font-size:18px;">
    Click here for the games
  </button>
</div>

<script>
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openGames() {
  const win = window.open("about:blank", "_blank");

  if (!win) {
    alert("Allow popups!");
    return;
  }

  win.document.write(`
    <iframe src="https://google-classroom-50z.pages.dev/"
    style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;">
    </iframe>
  `);
}
</script>

</body>
</html>
